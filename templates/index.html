<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufgabengenerator für Lehrkräfte</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Aufgabengenerator für Lehrkräfte</h1>
        <form id="taskForm">
            <div class="form-group">
                <label for="grade">Klassenstufe:</label>
                <input type="text" id="grade" name="grade" required>
            </div>

            <div class="form-group">
                <label for="subject">Fach:</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div class="form-group">
                <label for="pdfFile">Dokument (PDF):</label>
                <input type="file" id="pdfFile" name="pdfFile" accept=".pdf">
            </div>

            <div class="form-group">
                <label for="curriculum_competency">Lehrplankompetenz:</label>
                <input type="text" id="curriculum_competency" name="curriculum_competency">
            </div>

            <div class="form-group">
                <label for="current_topic">Aktuelles Thema:</label>
                <input type="text" id="current_topic" name="current_topic" required>
            </div>

            <div class="form-group">
                <label for="social_form">Sozialform:</label>
                <div class="input-with-suggestion">
                    <input type="text" id="social_form" name="social_form" required>
                    <button type="button" class="suggestion-btn" data-field="social_form">
                        Vorschlag
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="time">Zeit:</label>
                <input type="text" id="time" name="time" required>
            </div>

            <div class="form-group">
                <label for="media_competency">Medienbildungs-Kompetenz:</label>
                <input type="text" id="media_competency" name="media_competency">
            </div>

            <div class="form-group">
                <label for="task_format">Aufgabenformat:</label>
                <div class="input-with-suggestion">
                    <input type="text" id="task_format" name="task_format">
                    <button type="button" class="suggestion-btn" data-field="task_format">
                        Vorschlag
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="student_interests">Interessen der Schüler:</label>
                <input type="text" id="student_interests" name="student_interests">
            </div>

            <div class="form-group">
                <label for="digital_tools">Digitale Tools:</label>
                <div class="input-with-suggestion">
                    <input type="text" id="digital_tools" name="digital_tools">
                    <button type="button" class="suggestion-btn" data-field="digital_tools">
                        Vorschlag
                    </button>
                </div>
            </div>

            <button type="submit">Aufgaben generieren</button>
        </form>

        <div id="result" class="result-container"></div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
